<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development AI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
        }
        .app {
            width: min(900px, 100%);
            height: min(720px, 94vh);
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, .88);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 24px 70px rgba(0,0,0,.35);
            backdrop-filter: blur(16px);
        }
        header {
            padding: 22px 24px;
            border-bottom: 1px solid rgba(255,255,255,.1);
        }
        header h1 { margin: 0 0 6px; font-size: 25px; }
        header p { margin: 0; color: #94a3b8; font-size: 14px; }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 22px;
        }
        .message {
            max-width: 78%;
            padding: 13px 16px;
            margin-bottom: 14px;
            border-radius: 17px;
            line-height: 1.55;
            white-space: pre-wrap;
        }
        .user {
            margin-left: auto;
            background: #2563eb;
        }
        .bot {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,.08);
        }
        form {
            display: flex;
            gap: 10px;
            padding: 16px;
            border-top: 1px solid rgba(255,255,255,.1);
            background: rgba(2,6,23,.55);
        }
        input {
            flex: 1;
            min-width: 0;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            border-radius: 14px;
            padding: 14px 16px;
            outline: none;
        }
        button {
            border: 0;
            border-radius: 14px;
            padding: 0 20px;
            background: #38bdf8;
            color: #082f49;
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: .55; cursor: wait; }
        @media (max-width: 600px) {
            .app { height: 94vh; border-radius: 18px; }
            .message { max-width: 88%; }
            header { padding: 18px; }
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>Web Development AI</h1>
        <p>Focused study assistant • Powered by Gemini</p>
    </header>
    <main id="chat">
        <div class="message bot">Hello! I can help you with an HTML, CSS, JavaScript, and web development study questions.</div>
    </main>
    <form id="chatForm">
        <input id="messageInput" placeholder="Ask a study question..." autocomplete="off" required>
        <button id="sendButton" type="submit">Send</button>
    </form>
</div>

<script>
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const chat = document.getElementById("chat");
const button = document.getElementById("sendButton");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = `message ${type}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";
    button.disabled = true;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message })
        });
        const data = await response.json();
        addMessage(data.reply || "No response received.", "bot");
    } catch (error) {
        addMessage("Unable to connect to the chatbot.", "bot");
    } finally {
        button.disabled = false;
        input.focus();
    }
});
</script>
</body>
</html>
